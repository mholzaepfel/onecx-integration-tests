name: Create Release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: 'Version bump (patch / minor / major)'
                required: true
                type: choice
                default: minor
                options:
                    - patch
                    - minor
                    - major

permissions:
    id-token: write
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false # never use caching in release builds
            - run: npm ci
            - run: npm run lint
            - run: npm run test
            - run: npm run release ${{ inputs.bump }}
